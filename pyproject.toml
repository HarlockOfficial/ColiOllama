[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "coliollama"
version = "0.1.0"
description = "Ollama-style CLI, registry and API in front of the Colibrí disk-streamed MoE engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "typer>=0.12",
    "httpx>=0.27",
    "huggingface_hub>=0.23",
    # `coli convert` (run on every first `pull`/`run`) imports these in our interpreter.
    # For a smaller CPU-only torch:
    #   pip install torch --index-url https://download.pytorch.org/whl/cpu
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "openai>=1.0"]

[project.scripts]
coliollama = "coliollama.cli.main:app"

[tool.setuptools.packages.find]
include = ["coliollama*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
